# Avisa con un PR cuando una dependencia o una acción de GitHub tiene una
# versión nueva o un arreglo de seguridad (OWASP A06).
# Deja solo los ecosistemas que use el proyecto.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acciones:
        patterns: ["*"]
